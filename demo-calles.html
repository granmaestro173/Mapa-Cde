<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa de calles propio · demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{--bg:#f6f4ef;--panel:#ffffff;--ink:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1a73e8;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#202124;--panel:#2d2e31;--ink:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:fixed;inset:0}
.top{position:fixed;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.card{pointer-events:auto;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:10px 16px;font-size:14px;display:flex;gap:8px;align-items:center;min-width:0}
.card b{white-space:nowrap}.card span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{pointer-events:auto;margin-left:auto;display:flex;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:500 13px/1 inherit;font-family:inherit;padding:9px 13px;border-radius:17px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.opac{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:5;background:var(--panel);box-shadow:var(--shadow);border-radius:18px;padding:6px 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.opac[hidden]{display:none}.opac input{width:140px;accent-color:var(--accent)}
.estado{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;background:var(--panel);box-shadow:var(--shadow);border-radius:18px;padding:8px 14px;font-size:13px;color:var(--muted)}
.estado:empty{display:none}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border-radius:10px;font-size:13px;padding:8px 12px;box-shadow:var(--shadow)}
.maplibregl-ctrl-group{border-radius:8px!important;box-shadow:var(--shadow)!important}
.maplibregl-ctrl-attrib{font-size:10.5px}
@media (max-width:480px){.card span{display:none}.seg button{padding:9px 8px;font-size:12px}.card b{font-size:13px}}
@media (max-width:400px){.card{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="card"><b>Mapa de calles propio</b><span>Demo · datos de OpenStreetMap</span></div>
  <div class="seg" role="group" aria-label="Tipo de mapa">
    <button id="bCalles" aria-pressed="true">Calles</button>
    <button id="bSat" aria-pressed="false">Satélite</button>
    <button id="bSup" aria-pressed="false">Superponer</button>
  </div>
</div>
<label class="opac" id="opac" hidden>Calles <input type="range" id="rOpac" min="0" max="100" value="85" aria-label="Transparencia de las calles"></label>
<div class="estado" id="estado">Cargando el mapa…</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="config.js"></script>
<script>
// Demo: mapa de calles con estilo propio (colores, grosores y nombres los definimos nosotros).
// Los datos son de OpenStreetMap (ODbL) y llegan en "teselas vectoriales" del servicio gratuito OpenFreeMap,
// que no pide registro ni tiene límite de visitas. El dibujo lo hace el navegador con MapLibre.
const oscuro = matchMedia("(prefers-color-scheme: dark)").matches;
const C = oscuro
  ? {tierra:"#1d2327", parque:"#1f3326", agua:"#1d4157", aguaTxt:"#8fbcd4", edif:"#262e33", calle:"#3b464d", calleBorde:"#151b1f",
     av:"#6b5a2e", avBorde:"#3a3120", ruta:"#7a4f2a", rutaBorde:"#45301b", txt:"#d5d9dc", halo:"#1d2327", barrio:"#9aa0a6"}
  : {tierra:"#f2efe9", parque:"#d6e8c9", agua:"#aad3df", aguaTxt:"#4a7f99", edif:"#e4dfd6", calle:"#ffffff", calleBorde:"#d4cfc4",
     av:"#fde293", avBorde:"#e3b55a", ruta:"#f9b26b", rutaBorde:"#d9853a", txt:"#3c4043", halo:"#ffffff", barrio:"#70757a"};

// Grosor de cada tipo de calle según el zoom.
const ancho = (z13, z16, z19, extra = [0, 0, 0]) => ["interpolate", ["exponential", 1.6], ["zoom"], 13, z13 + extra[0], 16, z16 + extra[1], 19, z19 + extra[2]];
const tipo = (...c) => ["match", ["get", "class"], c, true, false];
const CALLES = [
  {id:"menor", f:tipo("minor", "service", "track", "path", "pedestrian"), w:[.6, 4, 16], c:C.calle, b:C.calleBorde, min:13.5},
  {id:"terciaria", f:tipo("tertiary"), w:[1.2, 6, 20], c:C.calle, b:C.calleBorde, min:12},
  {id:"avenida", f:tipo("primary", "secondary"), w:[2.2, 8, 26], c:C.av, b:C.avBorde, min:10},
  {id:"ruta", f:tipo("trunk", "motorway"), w:[3, 10, 30], c:C.ruta, b:C.rutaBorde, min:8}
];
const fuente = ["Noto Sans Regular"], negrita = ["Noto Sans Bold"];

const style = {
  version:8,
  glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
  sources:{
    osm:{type:"vector", url:"https://tiles.openfreemap.org/planet", attribution:"© colaboradores de OpenStreetMap · OpenFreeMap"},
    ...((window.CDE_CONFIG || {}).esriKey ? {sat:{type:"raster", tileSize:256, maxzoom:18,
      tiles:["https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=" + encodeURIComponent(CDE_CONFIG.esriKey)],
      attribution:"Powered by Esri · Imágenes © Esri, Maxar, Earthstar Geographics"}} : {})
  },
  layers:[
    {id:"fondo", type:"background", paint:{"background-color":C.tierra}},
    ...((window.CDE_CONFIG || {}).esriKey ? [{id:"satelite", type:"raster", source:"sat", layout:{visibility:"none"}}] : []),
    {id:"parques", type:"fill", source:"osm", "source-layer":"park", paint:{"fill-color":C.parque}},
    {id:"verde", type:"fill", source:"osm", "source-layer":"landcover", filter:tipo("grass", "wood"), paint:{"fill-color":C.parque, "fill-opacity":.6}},
    {id:"agua", type:"fill", source:"osm", "source-layer":"water", paint:{"fill-color":C.agua}},
    {id:"arroyos", type:"line", source:"osm", "source-layer":"waterway", paint:{"line-color":C.agua, "line-width":ancho(1, 2, 5)}},
    // Primero todos los bordes y después los rellenos, así los cruces quedan limpios.
    ...CALLES.map(k => ({id:k.id + "-borde", type:"line", source:"osm", "source-layer":"transportation", minzoom:k.min, filter:k.f,
      layout:{"line-cap":"round", "line-join":"round"}, paint:{"line-color":k.b, "line-width":ancho(...k.w, [.9, 1.6, 3])}})),
    ...CALLES.map(k => ({id:k.id, type:"line", source:"osm", "source-layer":"transportation", minzoom:k.min, filter:k.f,
      layout:{"line-cap":"round", "line-join":"round"}, paint:{"line-color":k.c, "line-width":ancho(...k.w)}})),
    {id:"puente-frontera", type:"line", source:"osm", "source-layer":"boundary", filter:["==", ["get", "admin_level"], 2],
      paint:{"line-color":C.barrio, "line-width":1.2, "line-dasharray":[3, 2], "line-opacity":.6}},
    {id:"nombres-agua", type:"symbol", source:"osm", "source-layer":"water_name",
      layout:{"text-field":["get", "name"], "text-font":fuente, "text-size":13, "text-letter-spacing":.2},
      paint:{"text-color":C.aguaTxt, "text-halo-color":C.halo, "text-halo-width":1}},
    {id:"nombres-calles", type:"symbol", source:"osm", "source-layer":"transportation_name", minzoom:14,
      layout:{"symbol-placement":"line", "text-field":["get", "name"], "text-size":["interpolate", ["linear"], ["zoom"], 14, 10, 18, 13],
        "text-font":["match", ["get", "class"], ["trunk", "primary", "secondary", "motorway"], ["literal", negrita], ["literal", fuente]], "text-max-angle":30, "symbol-spacing":300},
      paint:{"text-color":C.txt, "text-halo-color":C.halo, "text-halo-width":1.6}},
    {id:"barrios", type:"symbol", source:"osm", "source-layer":"place", filter:tipo("suburb", "neighbourhood", "quarter"), minzoom:13, maxzoom:17,
      layout:{"text-field":["get", "name"], "text-font":negrita, "text-size":12, "text-transform":"uppercase", "text-letter-spacing":.12, "text-max-width":8},
      paint:{"text-color":C.barrio, "text-halo-color":C.halo, "text-halo-width":1.5}},
    {id:"ciudades", type:"symbol", source:"osm", "source-layer":"place", filter:tipo("city", "town"),
      layout:{"text-field":["get", "name"], "text-font":negrita, "text-size":["interpolate", ["linear"], ["zoom"], 10, 13, 14, 18]},
      paint:{"text-color":C.txt, "text-halo-color":C.halo, "text-halo-width":2}},
  ]
};

const map = new maplibregl.Map({container:"map", style, fadeDuration:0, renderWorldCopies:false, pixelRatio:Math.min(devicePixelRatio || 1, 2), maxPitch:0, center:[-54.6135, -25.5095], zoom:15, minZoom:12, maxZoom:19,
  maxBounds:[[-54.75, -25.62], [-54.55, -25.43]], attributionControl:{compact:true}, dragRotate:false, pitchWithRotate:false});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "bottom-right");
map.on("load", () => { document.getElementById("estado").textContent = ""; });
map.on("error", e => { if (!map.loaded() && e.sourceId !== "sat" && !e.tile) document.getElementById("estado").textContent = "No se pudo cargar el mapa. Probá recargar."; console.warn(e.error); });

// Denuncias de ejemplo, para ver cómo quedan los marcadores encima.
const ICONS = {
  bache:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 17h18"/><path d="M7 17c1-3 3-4 5-4s4 1 5 4"/></svg>',
  inundacion:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 10c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 16c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg>',
  animal:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="10" r="2.2"/><path d="M12 11c-3 0-6 4-6 7 0 2 2 2 3 2s2-1 3-1 2 1 3 1 3 0 3-2c0-3-3-7-6-7z"/></svg>',
  semaforo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="2.5" width="8" height="19" rx="2.5"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="16.5" r="1.4" fill="currentColor"/></svg>',
  inseguro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 17H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>',
  asalto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
  basura:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>',
  alumbrado:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>'
};
const CAM = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5z"/><circle cx="12" cy="13" r="3.6" fill="var(--panel)"/></svg>';
// Los marcadores se dibujan dentro del mapa (no como elementos de la página), así mover y hacer zoom es fluido
// aunque haya cientos de denuncias. Cada ícono se arma una vez, igual al de la página principal.
const COLOR = {bache:"#d9622b", inundacion:"#2a7fd4", animal:"#8d6a4c", semaforo:"#d99a00", inseguro:"#7b52c4", asalto:"#d23a4b", basura:"#4f8a3a", alumbrado:"#17999a"};
const GOTA = "M0,-12A12,12 0 0 1 12,0A12,12 0 0 1 0,12L-8,12A4,4 0 0 1 -12,8L-12,0A12,12 0 0 1 0,-12Z";
function iconoSvg(cat, hot, foto){
  const ico = ICONS[cat].replace("<svg ", '<svg x="17.5" y="15.5" width="13" height="13" ').replaceAll("currentColor", "#fff");
  const camara = CAM.replace("<svg ", '<svg x="32" y="5" width="9" height="9" ').replaceAll("currentColor", "#202124").replace("var(--panel)", "#fff");
  return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="44" viewBox="0 0 48 44">
    <g transform="translate(24 22) rotate(-45)">
      <path d="${GOTA}" transform="translate(1.2 1.2)" fill="rgba(0,0,0,.28)"/>
      ${hot ? `<path d="${GOTA}" transform="scale(1.33)" fill="none" stroke="#fbbc04" stroke-width="2.4"/>` : ""}
      <path d="${GOTA}" fill="${COLOR[cat]}" stroke="#fff" stroke-width="2"/>
    </g>${ico}
    ${foto ? `<circle cx="36.5" cy="9.5" r="7" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>${camara}` : ""}</svg>`;
}
// Versión simple (para la vista Calles): la gota del color de la categoría con un punto blanco.
const iconoSimple = cat => `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="44" viewBox="0 0 48 44">
  <g transform="translate(24 22) rotate(-45)"><path d="${GOTA}" transform="translate(1.2 1.2)" fill="rgba(0,0,0,.28)"/>
  <path d="${GOTA}" fill="${COLOR[cat]}" stroke="#fff" stroke-width="2"/></g><circle cx="24" cy="22" r="3.6" fill="#fff"/></svg>`;
const imagenPin = () => vista === "calles" ? ["concat", "simple-", ["get", "cat"]] : ["get", "img"];
function cargarImagen(id, svg){
  return new Promise(ok => {
    const img = new Image(96, 88);
    img.onload = () => { const c = document.createElement("canvas"); c.width = 96; c.height = 88; c.getContext("2d").drawImage(img, 0, 0, 96, 88);
      if (!map.hasImage(id)) map.addImage(id, c.getContext("2d").getImageData(0, 0, 96, 88), {pixelRatio:2}); ok(); };
    img.onerror = () => ok();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
Promise.all([fetch("datos-ejemplo.json").then(r => r.json()), new Promise(ok => map.once("load", ok))]).then(async ([d]) => {
  const lista = d.denuncias.filter(r => r.status !== "resuelta");
  const nombre = r => `pin-${r.cat}-${r.votes >= 8 ? 1 : 0}-${r.photo || r.hasPhoto ? 1 : 0}`;
  await Promise.all([...new Set(lista.map(nombre))].map(id => { const [, cat, h, f] = id.split("-"); return cargarImagen(id, iconoSvg(cat, h === "1", f === "1")); }));
  await Promise.all([...new Set(lista.map(r => r.cat))].map(cat => cargarImagen("simple-" + cat, iconoSimple(cat))));
  map.addSource("denuncias", {type:"geojson", data:{type:"FeatureCollection", features:lista.map(r => ({type:"Feature",
    geometry:{type:"Point", coordinates:[r.lng, r.lat]}, properties:{img:nombre(r), cat:r.cat, desc:r.desc, barrio:r.barrio || ""}}))}});
  map.addLayer({id:"denuncias", type:"symbol", source:"denuncias", layout:{"icon-image":imagenPin(), "icon-anchor":"center", "icon-offset":[0, -15],
    "icon-allow-overlap":true, "icon-ignore-placement":true, "symbol-z-order":"viewport-y"}});
  map.on("click", "denuncias", e => { const f = e.features[0];
    new maplibregl.Popup({offset:32, closeButton:false}).setLngLat(f.geometry.coordinates).setText(f.properties.desc + (f.properties.barrio ? " · " + f.properties.barrio : "")).addTo(map); });
  map.on("mouseenter", "denuncias", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "denuncias", () => map.getCanvas().style.cursor = "");
}).catch(() => {});

// Tres vistas: Calles (nuestro mapa), Satélite (solo la imagen de Esri) y Superponer
// (nuestras calles encima del satélite, al estilo de las rutas de Esri, para comprobar que coinciden).
const SUPERFICIES = ["parques", "verde", "agua", "arroyos"];
const NOMBRES = ["nombres-agua", "nombres-calles", "barrios", "ciudades"];
const HIBRIDO = {menor:"#ffffff", terciaria:"#ffffff", avenida:"#ffe08a", ruta:"#ffb35c"};
let vista = "calles";
function pintar(){
  const sat = vista !== "calles", sup = vista === "superponer", op = document.getElementById("rOpac").value / 100;
  const ver = (id, si) => map.setLayoutProperty(id, "visibility", si ? "visible" : "none");
  if (map.getLayer("satelite")) ver("satelite", sat);
  for (const id of SUPERFICIES) ver(id, !sat);
  for (const k of CALLES){
    ver(k.id, vista !== "satelite"); ver(k.id + "-borde", vista !== "satelite");
    map.setPaintProperty(k.id, "line-color", sup ? HIBRIDO[k.id] : k.c);
    map.setPaintProperty(k.id, "line-opacity", sup ? op : 1);
    map.setPaintProperty(k.id + "-borde", "line-color", sup ? "#000000" : k.b);
    map.setPaintProperty(k.id + "-borde", "line-opacity", sup ? op * .45 : 1);
    // Encima del satélite las calles van más finas, para ver la calle real debajo.
    map.setPaintProperty(k.id, "line-width", sup ? ancho(...k.w.map(x => x * .45)) : ancho(...k.w));
    map.setPaintProperty(k.id + "-borde", "line-width", sup ? ancho(...k.w.map(x => x * .45), [.8, 1.2, 1.6]) : ancho(...k.w, [.9, 1.6, 3]));
  }
  for (const id of NOMBRES){
    ver(id, vista !== "satelite");
    map.setPaintProperty(id, "text-color", sup ? "#ffffff" : id === "nombres-agua" ? C.aguaTxt : id === "barrios" ? C.barrio : C.txt);
    map.setPaintProperty(id, "text-halo-color", sup ? "rgba(0,0,0,.75)" : C.halo);
  }
  ver("puente-frontera", !sat);
  // Íconos simples sobre el mapa de calles; los completos (con categoría, foto y votos) sobre el satélite.
  if (map.getLayer("denuncias")) map.setLayoutProperty("denuncias", "icon-image", imagenPin());
  document.getElementById("opac").hidden = !sup;
  for (const [b, v] of [["bCalles", "calles"], ["bSat", "satelite"], ["bSup", "superponer"]]) document.getElementById(b).setAttribute("aria-pressed", vista === v);
}
const cambiar = v => { vista = v; if (map.isStyleLoaded()) pintar(); else map.once("load", pintar); };
document.getElementById("bCalles").onclick = () => cambiar("calles");
document.getElementById("bSat").onclick = () => cambiar("satelite");
document.getElementById("bSup").onclick = () => cambiar("superponer");
let pendiente = false;
document.getElementById("rOpac").oninput = () => { if (vista !== "superponer" || pendiente) return; pendiente = true; requestAnimationFrame(() => { pendiente = false; pintar(); }); };
if (!(window.CDE_CONFIG || {}).esriKey) document.getElementById("bSat").hidden = document.getElementById("bSup").hidden = true;
</script>
</body>
</html>
